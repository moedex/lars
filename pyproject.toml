[project]
name = "moelars"
version = "0.0.1"
description = "Moe Limited but Accurate Response System: a local-models-only typed-decision API in the shape of System One"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Zak Keown" }]
keywords = ["system-one", "typed-decisions", "calibration", "classification", "local-llm"]
dependencies = [
  "fastapi>=0.115",
  "numpy>=1.26",
  "pydantic>=2.7",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.20"]
llamacpp = ["llama-cpp-python>=0.3"]
evals = ["datasets>=3.0"]
dev = [
  "httpx>=0.27",
  "pytest>=8",
  "ruff>=0.6",
  "typesafe-sdk>=0.7",
]
mcp = ["mcp>=2.2,<3", "httpx>=0.27"]
escalate = [
    "anthropic>=1.0",
]

[project.scripts]
moelars = "moelars.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moelars"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
